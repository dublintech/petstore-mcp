spring.application.name=petstore-auth
server.port=9000
# Loopback only, like the gateway.
server.address=127.0.0.1

# The issuer is this server's identity: it goes into every token's "iss" claim, and the gateway and API will
# only trust tokens whose issuer matches. It is also the base for the discovery documents.
spring.security.oauth2.authorizationserver.issuer=http://localhost:9000

# --- The one pre-registered client: mcp-remote acting for Claude Desktop ---------------------------------------
# Pre-registration is the MCP spec's first choice when client and server already know each other.
# A public client: it runs on the user's machine and cannot keep a secret, so it has no client secret ("none")
# and must prove each login with PKCE instead.
spring.security.oauth2.authorizationserver.client.petstore-mcp-client.registration.client-id=petstore-mcp-client
spring.security.oauth2.authorizationserver.client.petstore-mcp-client.registration.client-name=Petstore MCP (mcp-remote)
spring.security.oauth2.authorizationserver.client.petstore-mcp-client.registration.client-authentication-methods=none
spring.security.oauth2.authorizationserver.client.petstore-mcp-client.registration.authorization-grant-types=authorization_code,refresh_token
# mcp-remote's callback listener. It uses the loopback IP 127.0.0.1, not "localhost", as RFC 8252 recommends. For a
# loopback IP Spring accepts any port (OAuth 2.1 section 8.4.2) but requires the same host and path; any other host,
# "localhost" included, must match the registered URI exactly.
spring.security.oauth2.authorizationserver.client.petstore-mcp-client.registration.redirect-uris=http://127.0.0.1:3334/oauth/callback
# petstore.read for browsing; petstore.buy for buyPet (used from step 8).
spring.security.oauth2.authorizationserver.client.petstore-mcp-client.registration.scopes=petstore.read,petstore.buy
spring.security.oauth2.authorizationserver.client.petstore-mcp-client.require-proof-key=true
# Show a consent screen, so the user decides which scopes the client gets. This config with show
# DefaultConsentPage in spring-security-oauth2-authorization-server
spring.security.oauth2.authorizationserver.client.petstore-mcp-client.require-authorization-consent=true

# --- Token lifetimes --------------------------------------------------------------------------------------------
# Short-lived access tokens limit the damage from a leak (the spec's advice).
spring.security.oauth2.authorizationserver.client.petstore-mcp-client.token.access-token-time-to-live=5m
spring.security.oauth2.authorizationserver.client.petstore-mcp-client.token.refresh-token-time-to-live=8h
# Rotate refresh tokens: each use returns a new one and retires the old (the spec requires this for public clients).
spring.security.oauth2.authorizationserver.client.petstore-mcp-client.token.reuse-refresh-tokens=false

# --- The gateway, as a client of this server --------------------------------------------------------------------
# A confidential client: it runs on a server, so unlike mcp-remote it can keep a secret. It never logs a user in.
#   client_credentials  gets a token about the gateway itself, which it sends as the actor_token in an exchange
#   token-exchange      swaps a user's token (aud = the gateway) for one meant for the API (RFC 8693)
# Only a BCrypt hash of the secret is kept here. The plain value, for development only, is
# "gateway-dev-secret-not-for-production"; a real deployment would set its own secret on both sides.
spring.security.oauth2.authorizationserver.client.petstore-gateway.registration.client-id=petstore-gateway
spring.security.oauth2.authorizationserver.client.petstore-gateway.registration.client-name=Petstore MCP gateway
spring.security.oauth2.authorizationserver.client.petstore-gateway.registration.client-secret={bcrypt}$2a$10$bFr7PgN.bXDhkxvDfK2Ztusi/mE04FDqTODt0tq0SayXMTU3vWXsy
spring.security.oauth2.authorizationserver.client.petstore-gateway.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.petstore-gateway.registration.authorization-grant-types=client_credentials,urn:ietf:params:oauth:grant-type:token-exchange
# The most it can ever ask for. An exchanged token gets at most what the user approved (TokenExchangeRules).
spring.security.oauth2.authorizationserver.client.petstore-gateway.registration.scopes=petstore.read,petstore.buy
spring.security.oauth2.authorizationserver.client.petstore-gateway.token.access-token-time-to-live=5m

# --- Resources tokens can be issued for (RFC 8707) --------------------------------------------------------------
# A client names the server it wants a token for in the "resource" parameter; that becomes the token's audience.
# Only these are allowed: the gateway (for mcp-remote) and the API (for the gateway, by token exchange).
petstore.auth.resources=http://localhost:8081/mcp,http://localhost:8080

# --- Token exchange (RFC 8693) ----------------------------------------------------------------------------------
# Which client may exchange tokens issued for which resource. Only the gateway may exchange, and only tokens that
# were meant for it, so a user's token sent to some other server can't be turned into an API token.
petstore.auth.token-exchange.clients.petstore-gateway=http://localhost:8081/mcp
