spring.application.name=petstore-api
server.port=8080

# Listen on loopback only, like the gateway and petstore-auth.
server.address=127.0.0.1

# --- OAuth: the API is a protected resource -----------------------------------------------------------------
# Every request (except the OpenAPI document) needs a bearer token from petstore-auth. Like the gateway, the API
# fetches the signing keys the first time a token arrives, so it starts even if petstore-auth isn't running.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
# The API's identity. Tokens must name it in "aud": the gateway gets one by token exchange. A user's token for the
# gateway (aud = http://localhost:8081/mcp) is refused here, so the gateway can't simply pass it through.
spring.security.oauth2.resourceserver.jwt.audiences=http://localhost:8080