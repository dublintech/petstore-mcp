spring.application.name=petstore-mcp
server.port=8081
# Listen on loopback only, so other machines on the network can't reach the MCP endpoint
# (the transport spec says local servers SHOULD bind to 127.0.0.1, not 0.0.0.0).
server.address=127.0.0.1

# Browser origins allowed to call /mcp (DNS rebinding protection). Requests with no Origin header are
# always allowed: that covers Claude Desktop (Claude Desktop -> stdio -> mcp-remote -> HTTP), which needs
# no entry here. The list is for browser-based MCP clients; the default is the MCP Inspector's web UI.
#petstore.mcp.allowed-origins=http://localhost:6274,http://127.0.0.1:6274

# --- OAuth: the gateway is a protected resource ------------------------------------------------------------
# Every request needs a bearer token from this authorization server. Spring finds the signing keys through its
# discovery document the first time a token arrives, so the gateway starts even if petstore-auth isn't running.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
# The gateway's identity. Tokens must name it in "aud" (RFC 8707), so a token issued for another server is refused.
petstore.mcp.resource=http://localhost:8081/mcp
spring.security.oauth2.resourceserver.jwt.audiences=${petstore.mcp.resource}

# Where the Petstore REST API lives, and how long to wait for it
petstore.api.base-url=http://localhost:8080
petstore.api.connect-timeout=2s
petstore.api.read-timeout=5s

# MCP server: Streamable HTTP transport on /mcp, tools discovered from @McpTool beans.
# The protocol must be set explicitly; when unset, Spring AI 2.0.1 wires the legacy SSE transport.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=petstore
spring.ai.mcp.server.version=1.0.7
spring.ai.mcp.server.instructions=Swagger Petstore: search pets, buy a pet, and look up orders and users.
