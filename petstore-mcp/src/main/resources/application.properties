spring.application.name=petstore-mcp
server.port=8081

# Where the Petstore REST API lives, and how long to wait for it
petstore.api.base-url=http://localhost:8080
petstore.api.connect-timeout=2s
petstore.api.read-timeout=5s

# MCP server: Streamable HTTP transport on /mcp, tools discovered from @McpTool beans.
# The protocol must be set explicitly; when unset, Spring AI 2.0.1 wires the legacy SSE transport.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=petstore
spring.ai.mcp.server.version=1.0.7
spring.ai.mcp.server.instructions=Swagger Petstore: search pets, buy a pet, and look up orders and users.
