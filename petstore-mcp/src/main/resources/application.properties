spring.application.name=petstore-mcp
server.port=8081
# Listen on loopback only, so other machines on the network can't reach the MCP endpoint
# (the transport spec says local servers SHOULD bind to 127.0.0.1, not 0.0.0.0).
server.address=127.0.0.1

# Browser origins allowed to call /mcp (DNS rebinding protection). Requests with no Origin header are
# always allowed: that covers Claude Desktop (Claude Desktop -> stdio -> mcp-remote -> HTTP), which needs
# no entry here. The list is for browser-based MCP clients; the default is the MCP Inspector's web UI.
#petstore.mcp.allowed-origins=http://localhost:6274,http://127.0.0.1:6274

# --- OAuth: the gateway is a protected resource ------------------------------------------------------------
# Every request needs a bearer token from this authorization server. Spring finds the signing keys through its
# discovery document the first time a token arrives, so the gateway starts even if petstore-auth isn't running.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
# The gateway's identity. Tokens must name it in "aud" (RFC 8707), so a token issued for another server is refused.
petstore.mcp.resource=http://localhost:8081/mcp
spring.security.oauth2.resourceserver.jwt.audiences=${petstore.mcp.resource}

# --- OAuth: the gateway is also a client, to call the API --------------------------------------------------
# The API refuses the user's token (its aud is the gateway). So for each user token the gateway asks petstore-auth
# for one meant for the API (RFC 8693 token exchange), proving who it is with its own client_credentials token.
# Only the token endpoint is configured, not an issuer-uri, so nothing is fetched at startup.
spring.security.oauth2.client.provider.petstore-auth.token-uri=http://localhost:9000/oauth2/token
spring.security.oauth2.client.registration.petstore-api.provider=petstore-auth
spring.security.oauth2.client.registration.petstore-api.client-id=petstore-gateway
spring.security.oauth2.client.registration.petstore-api.client-secret=${PETSTORE_GATEWAY_SECRET:gateway-dev-secret-not-for-production}
spring.security.oauth2.client.registration.petstore-api.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.petstore-api.authorization-grant-type=urn:ietf:params:oauth:grant-type:token-exchange
# The gateway's own token, sent as the actor_token so the API token says "user, through the gateway".
spring.security.oauth2.client.registration.petstore-gateway.provider=petstore-auth
spring.security.oauth2.client.registration.petstore-gateway.client-id=petstore-gateway
spring.security.oauth2.client.registration.petstore-gateway.client-secret=${PETSTORE_GATEWAY_SECRET:gateway-dev-secret-not-for-production}
spring.security.oauth2.client.registration.petstore-gateway.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.petstore-gateway.authorization-grant-type=client_credentials
# The API's identity: the resource the exchanged token is for, and so its "aud". Fixed, even when the API is
# reached through another address (such as the trace proxy).
petstore.api.resource=http://localhost:8080

# Where the Petstore REST API lives, and how long to wait for it
petstore.api.base-url=http://localhost:8080
petstore.api.connect-timeout=2s
petstore.api.read-timeout=5s

# MCP server: Streamable HTTP transport on /mcp, tools discovered from @McpTool beans.
# The protocol must be set explicitly; when unset, Spring AI 2.0.1 wires the legacy SSE transport.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=petstore
spring.ai.mcp.server.version=1.0.7
spring.ai.mcp.server.instructions=Swagger Petstore: search pets, buy a pet, and look up orders and users.
